output_dir: autoresearch_outputs/lbrdiv_lbf_exp

logger:
  use_wandb: false
  project: bayes-tom-parents
  log_train_out: false

local_logger:
  save_train_out: true

algorithm:
  ENV_NAME: lbf
  ENV_KWARGS: {}

  TRAIN_SEED: 42
  NUM_SEEDS: 1

  # Population
  PARTNER_POP_SIZE: 6

  # PPO / rollout
  NUM_ENVS: 64
  ROLLOUT_LENGTH: 128
  TOTAL_TIMESTEPS: 15_000_000

  LR: 5.0e-4
  ANNEAL_LR: false
  MAX_GRAD_NORM: 1.0
  NUM_MINIBATCHES: 4
  UPDATE_EPOCHS: 15
  CLIP_EPS: 0.05
  VF_COEF: 0.5
  ENT_COEF: 0.01
  GAMMA: 0.99
  GAE_LAMBDA: 0.95
  ACTIVATION: tanh

  # LBRDiv-specific
  TOLERANCE_FACTOR: 0.1
  LAGRANGE_LR: 0.01

  # Checkpointing / evaluation
  NUM_CHECKPOINTS: 5
  NUM_ARGMAX_ROLLOUT_EPS: 20
  NUM_EVAL_EPISODES: 10
